<script>

var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function muatXLSX() {
  return new Promise(function (res, rej) {
    if (window.XLSX) return res(window.XLSX);
    var s = document.createElement('script'); s.src = XLSX_URL;
    s.onload = function () { res(window.XLSX); }; s.onerror = function () { rej(new Error('Pustaka Excel tidak dapat dimuatkan. Semak sambungan internet.')); };
    document.head.appendChild(s);

}
function kumpulJK(jk) {
  // Kumpulan mengikut kategori; huruf bahagian (A–E) diambil daripada kod JK pertama dalam kategori itu.
  var peta = {}, urut = [];

  return urut.map(function (k) { return peta[k]; });
}
function namaPaparan(a) { return a.nama + (a.pemegang ? ' (' + a.pemegang + ')' : ''); }

      var e = peta[id], x = stafMap[id] || {}; e.jawatanStaf = x.jawatan || ''; e.jabatan = x.jabatan || 'TIADA JABATAN';
      e.total = e.jk.reduce(function (t, k) { return t + (Number(k.merit) || 0); }, 0); (kump[e.jabatan] = kump[e.jabatan] || []).push(e);

    return Object.keys(kump).sort(function (a, b) { return a.localeCompare(b, 'ms'); }).map(function (n) {
      var st = kump[n].sort(function (a, b) { return String(a.nama).localeCompare(String(b.nama), 'ms'); });
      return { jabatan: n, staf: st, bil: st.reduce(function (t, e) { return t + e.jk.length; }, 0) };
    });
  }
  var dataJab = jabatanData();
  var f = { jenis: pilihSelect([{ nilai: 'jk', label: 'Mengikut jawatankuasa' }, { nilai: 'jab', label: 'Mengikut jabatan' }], 'jk'),

  function modJab() { return f.jenis.value === 'jab'; }
  function lukisJabatan() {

    dok.appendChild(h('div', { class: 'cetak-sahaja kepala-cetak' }, jenama().logo ? h('img', { src: jenama().logo, alt: '', class: 'logo-cetak', onerror: "this.style.display='none'" }) : null, h('h1', null, 'SENARAI PELANTIKAN JAWATANKUASA MENGIKUT JABATAN'), h('h1', null, namaSekolahBesar() + ' TAHUN ' + d.tahun)));
    var pilih = dataJab.filter(function (g) { return !f.jab.value || g.jabatan === f.jab.value; }), m = f.merit.checked;

          e.jk.length ? h('table', { class: 'jadual-laporan' }, h('thead', null, h('tr', null, h('th', { style: 'width:48px' }, 'Bil'), h('th', { style: 'width:64px' }, 'Kod'), h('th', null, 'Jawatankuasa'), h('th', null, 'Jawatan'), m ? h('th', { class: 'nombor' }, 'Merit') : null)),

    var pilih = terpilih();
    if (!pilih.length) { dok.appendChild(h('div', { class: 'kosong' }, 'Tiada jawatankuasa untuk tahun ini.')); return; }
    pilih.forEach(function (g, gi) {
      var bahagian = h('section', { class: 'kumpulan' }, h('h2', { class: 'tajuk-bahagian' }, (g.huruf ? 'BAHAGIAN ' + g.huruf + ' — ' : '') + g.kategori.toUpperCase()));
      g.jk.forEach(function (j) {
        bahagian.appendChild(h('div', { class: 'blok-jk' }, h('h3', null, (j.kod ? j.kod + '  ' : '') + j.nama.toUpperCase()),
          j.ahli.length ? h('table', { class: 'jadual-laporan' }, h('thead', null, h('tr', null, h('th', { style: 'width:48px' }, 'Bil'), h('th', null, 'Nama'), h('th', null, 'Jawatan'), f.merit.checked ? h('th', { class: 'nombor' }, 'Merit') : null)),
            h('tbody', null, j.ahli.map(function (a, i) { return h('tr', null, h('td', null, i + 1), h('td', null, namaPaparan(a)), h('td', null, a.jawatan), f.merit.checked ? h('td', { class: 'nombor' }, a.merit) : null); })))
          : h('p', { class: 'diam' }, 'Belum ada ahli dilantik.')));

      dok.appendChild(bahagian);
    });
  }
  var lblKat = h('label', null, 'Paparkan ', f.kat), lblJab = h('label', { style: 'display:none' }, 'Jabatan ', f.jab);
  function sesuai() { lblKat.style.display = modJab() ? 'none' : ''; lblJab.style.display = modJab() ? '' : 'none'; lukis(); }
  f.jenis.addEventListener('change', sesuai); f.jab.addEventListener('change', lukis); f.kat.addEventListener('change', lukis); f.merit.addEventListener('change', lukis);

  async function excelJabatan() {
    var X = await muatXLSX(), m = f.merit.checked, pilih = dataJab.filter(function (g) { return !f.jab.value || g.jabatan === f.jab.value; });
    var baris = [['Jabatan', 'ID staf', 'Nama', 'Jawatan staf', 'Kod JK', 'Jawatankuasa', 'Jawatan dalam JK'].concat(m ? ['Merit'] : [])];
    pilih.forEach(function (g) { g.staf.forEach(function (e) {
      if (!e.jk.length) baris.push([g.jabatan, e.id, namaPaparan(e), e.jawatanStaf, '', 'Tiada pelantikan', ''].concat(m ? [''] : []));
      e.jk.forEach(function (k) { baris.push([g.jabatan, e.id, namaPaparan(e), e.jawatanStaf, k.kod, k.nama, k.jawatan].concat(m ? [k.merit] : [])); });
    }); });
    var ws = X.utils.aoa_to_sheet(baris); ws['!cols'] = [{ wch: 26 }, { wch: 10 }, { wch: 40 }, { wch: 22 }, { wch: 8 }, { wch: 50 }, { wch: 36 }, { wch: 7 }];
    var wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'Mengikut Jabatan ' + d.tahun); X.writeFile(wb, 'JK-Mengikut-Jabatan-' + d.tahun + '.xlsx');
    toast('Fail Excel dimuat turun.', 'berjaya');
  }

  async function excel() {
    if (modJab()) return excelJabatan();
    var X = await muatXLSX(), pilih = terpilih(), baris = [[tajukDok], []], gabung = [{ s: { r: 0, c: 0 }, e: { r: 0, c: f.merit.checked ? 3 : 2 } }], lebar = f.merit.checked ? 4 : 3;

    pilih.forEach(function (g) { g.jk.forEach(function (j) { j.ahli.forEach(function (a, i) { rata.push([g.huruf || g.kategori, j.kod, j.nama, i + 1, namaPaparan(a), a.jawatan, a.merit]); }); }); });
    var ws2 = X.utils.aoa_to_sheet(rata); ws2['!cols'] = [{ wch: 10 }, { wch: 8 }, { wch: 50 }, { wch: 5 }, { wch: 44 }, { wch: 40 }, { wch: 7 }];
    var wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'JK Induk ' + d.tahun); X.utils.book_append_sheet(wb, ws2, 'Senarai Rata'); X.writeFile(wb, 'JK-Induk-' + String(jenama().namaRingkas || 'Sekolah').replace(/[^A-Za-z0-9]+/g, '-') + '-' + d.tahun + '.xlsx');

  lukis();
  return h('div', null,
    h('div', { class: 'tajuk-halaman tiada-cetak' }, h('div', null, h('h1', null, 'Laporan JK Induk ' + d.tahun), h('p', null, nf(d.jk.length) + ' jawatankuasa · ' + nf(jumlahAhli) + ' pelantikan. Susunan ahli sama seperti fail JK Induk asal.'))),
    h('div', { class: 'kad tiada-cetak', style: 'margin-bottom:1rem' }, h('div', { class: 'baris-alat' },

    dok);
}
</script>
