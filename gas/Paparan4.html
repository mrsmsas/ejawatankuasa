<script>
/* ===== Surat rasmi (memo MARA): Surat Perlantikan & Surat Panggilan Mesyuarat ===== */
var TARIKH_PERLANTIKAN = '2027-01-04';   // tarikh tetap surat perlantikan
var BLN_MS = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
var HARI_MS = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
var BLN_HIJRAH = ['Muharam', 'Safar', 'Rabiulawal', 'Rabiulakhir', 'Jamadil Awal', 'Jamadil Akhir', 'Rejab', 'Syaaban', 'Ramadan', 'Syawal', 'Zulkaedah', 'Zulhijjah'];
var PENANDATANGAN_LALAI = { nama: 'KHAIRIL AZRI BIN MOHD HABIBOLLAH', jawatan: 'Pengetua' };

function tarikhDari(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null; }
function tarikhMasehi(d) { return d.getUTCDate() + ' ' + BLN_MS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
function tarikhHijrah(d) {
  try {
    var p = {}; new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day: 'numeric', month: 'numeric', year: 'numeric', timeZone: 'UTC' })
      .formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
    return p.day + ' ' + BLN_HIJRAH[Number(p.month) - 1] + ' ' + p.year + 'H';
  } catch (e) { return ''; }
}
function masaBM(hhmm) {
  var m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || ''); if (!m) return '';
  var j = +m[1], mn = m[2], j12 = j % 12 || 12, w = j < 12 ? 'pagi' : j < 14 ? 'tengah hari' : j < 19 ? 'petang' : 'malam';
  return j12 + '.' + mn + ' ' + w;
}
function ambilPenandatangan() {
  try { var t = JSON.parse(localStorage.getItem('jk_penandatangan') || 'null'); if (t && t.nama) return t; } catch (e) {}
  return PENANDATANGAN_LALAI;
}
function simpanPenandatangan(o) { try { localStorage.setItem('jk_penandatangan', JSON.stringify(o)); } catch (e) {} }

/* Satu helai memo (reka bentuk surat MARA): kepala "mara memograf", jadual rujukan, kandungan, tandatangan dan logo 60 tahun di kaki. */
function memo(o) {
  var td = function (kelas, span) { var anak = Array.prototype.slice.call(arguments, 2); return h.apply(null, ['td', { class: kelas || null, colspan: span || null }].concat(anak)); };
  // Sel rujukan: label di atas, nilai tebal di bawah; tengah secara mendatar, rapat ke atas secara menegak.
  var rc = function (label, nilai, span) { return h('td', { class: 'rc', colspan: span }, h('div', { class: 'rl' }, label), h('div', { class: 'rn' }, nilai)); };
  return h('div', { class: 'surat' },
    h('div', { class: 'surat-kepala' }, h('span', { class: 'mara' }, 'mara'), h('span', { class: 'memograf' }, 'memograf')),
    h('table', { class: 'surat-meta' },
      h('colgroup', null, [17.1, 9, 5, 29.8, 21.7, 17.4].map(function (w) { return h('col', { style: 'width:' + w + '%' }); })),
      h('tr', null, td('', 1, 'Kepada :'), td('b', 5, o.kepada)),
      h('tr', null, td('', 1, 'Daripada :'), td('b', 5, 'Pengetua Maktab Rendah Sains MARA Sultan Azlan Shah')),
      h('tr', null, td('', 2, 'Salinan Kepada :'), td('', 4, o.salinan || '')),
      h('tr', { class: 'ruj' }, rc('Rujuk Kami', o.rujukKami || '', 3), rc('Tarikh', [o.tarikh, h('br'), o.hijrah], 1), rc('Rujuk Tuan', '', 1), rc('Tarikh', '', 1))),
    h('p', { style: 'margin-top:1em' }, 'Tuan / Puan,'),
    h('p', { class: 'surat-tajuk' }, o.tajuk),
    o.badan,
    h('div', { class: 'surat-tutup' },
      h('p', { style: 'margin:0' }, h('b', null, '“MALAYSIA MADANI”'), h('br'), h('b', null, '“BERKHIDMAT UNTUK NEGARA”'), h('br'), h('b', null, '“LUAR BANDAR SEJAHTERA”')),
      h('p', null, h('b', null, 'Saya yang menjalankan amanah,')),
      h('div', { class: 'ttd' }),
      h('p', { style: 'margin:0' }, h('b', null, o.penandatangan.nama), h('br'), o.penandatangan.jawatan, h('br'), 'MRSM Sultan Azlan Shah', h('br'), 'Kuala Kangsar, Perak')));
}
function romawi(n) { return ['i', 'ii', 'iii', 'iv', 'v', 'vi', 'vii', 'viii', 'ix', 'x', 'xi', 'xii', 'xiii', 'xiv', 'xv', 'xvi', 'xvii', 'xviii', 'xix', 'xx'][n] || String(n + 1); }
// Label jawatan gaya surat: "Pengerusi", "Timb. Pengerusi I", "Ahli"
function labelJawatan(j) {
  var s = String(j).replace(/\s*—\s*(?=(I|II|III)$)/i, ' ').trim();
  if (/^AHLI JAWATANKUASA$/i.test(s)) return 'Ahli';
  return s.toLowerCase().replace(/\btimbalan\b/, 'timb.').replace(/(^|\s)(\S)/g, function (m, p, c) { return p + c.toUpperCase(); }).replace(/\b(Iii|Ii|I)$/, function (x) { return x.toUpperCase(); });
}
// Perenggan surat rasmi: nombor di jidar kiri, teks selepas satu tab, baris sambungan kembali ke jidar kiri, teks rata kiri-kanan.
function para(no, teks) { return h('p', { class: 'surat-para' }, no ? h('span', { class: 'no' }, no + '.') : null, teks); }

function borangPenandatangan() {
  var p = ambilPenandatangan(), n = h('input', { value: p.nama }), j = h('input', { value: p.jawatan });
  var simpan = function () { simpanPenandatangan({ nama: n.value, jawatan: j.value }); };
  return { nama: n, jawatan: j, simpan: simpan, medan: [medan('Nama penandatangan', n), medan('Jawatan penandatangan', j)], baca: function () { return { nama: n.value.trim(), jawatan: j.value.trim() }; } };
}
function kawalanHijrah() {
  var i = h('input', { placeholder: 'Auto — isi hanya jika perlu laras' });
  return { input: i, medan: medan('Tarikh Hijrah (pilihan)', i, 'Dikira automatik (Umm al-Qura). Isi jika kalendar rasmi berbeza satu hari, cth. 26 Rejab 1448H.'),
    nilai: function (d) { return i.value.trim() || tarikhHijrah(d); } };
}
function agendaNod(teks) {
  var baris = String(teks || '').split(/\n/).map(function (x) { return x.trim(); }).filter(Boolean);
  if (!baris.length) return [];
  return [para('3', 'Agenda mesyuarat adalah seperti berikut :'), h('div', { class: 'surat-agenda' }, baris.map(function (b, i) { return h('div', { class: 'ag' }, h('span', { class: 'rm' }, '( ' + romawi(i) + ' )'), h('span', null, b)); }))];
}
function dokSurat() { return h('div', { id: 'dokSurat' }); }
function butangCetak() { return h('button', { class: 'btn utama', onclick: function () { window.print(); } }, '🖨 Cetak / Simpan PDF'); }

/* ===== Surat Perlantikan ===== */
async function paparSuratLantik() {
  var d = await panggil('laporanInduk', { tahun: S.tahun }), tahun = d.tahun, tkh = tarikhDari(TARIKH_PERLANTIKAN);
  var peta = {}, urut = [];
  d.jk.forEach(function (j) {
    j.ahli.forEach(function (a) {
      var kunci = a.pemegangId || a.staffId || a.pemegang || a.nama, nama = a.pemegang || a.nama;
      if (!peta[kunci]) { peta[kunci] = { nama: nama, lantik: [] }; urut.push(kunci); }
      peta[kunci].lantik.push({ jk: (j.kod ? j.kod + ' ' : '') + j.nama, jawatan: a.jawatan });
    });
  });
  var senarai = urut.map(function (k) { return peta[k]; }).sort(function (x, y) { return x.nama.localeCompare(y.nama, 'ms'); });
  var pilih = pilihSelect(senarai.map(function (s, i) { return { nilai: i, label: s.nama + ' (' + s.lantik.length + ' jawatan)' }; }), '', 'Semua staf (cetak kelompok)');
  var tajuk = h('input', { value: 'PERLANTIKAN SEBAGAI AHLI JAWATANKUASA KERJA MRSM SULTAN AZLAN SHAH TAHUN ' + tahun });
  var tt = borangPenandatangan(), hj = kawalanHijrah(), dok = dokSurat();

  function lukis() {
    kosongkan(dok); var hijrah = hj.nilai(tkh), ttd = tt.baca();
    var terpilih = pilih.value === '' ? senarai : [senarai[Number(pilih.value)]];
    if (!terpilih.length) { dok.appendChild(h('div', { class: 'kosong' }, 'Tiada pelantikan untuk tahun ' + tahun + '.')); return; }
    terpilih.forEach(function (s) {
      var jadualLantik = h('table', { class: 'surat-jadual' }, h('thead', null, h('tr', null, h('th', { style: 'width:40px' }, 'Bil'), h('th', null, 'Jawatankuasa'), h('th', null, 'Jawatan'))),
        h('tbody', null, s.lantik.map(function (l, i) { return h('tr', null, h('td', { style: 'text-align:center' }, i + 1), h('td', null, l.jk), h('td', null, l.jawatan)); })));
      dok.appendChild(memo({ kepada: s.nama, rujukKami: '', tarikh: tarikhMasehi(tkh), hijrah: hijrah, tajuk: tajuk.value, penandatangan: ttd,
        badan: [para('', 'Dengan segala hormatnya mohon di rujuk perkara di atas.'),
          para('2', 'Sukacita dimaklumkan bahawa tuan/puan telah dilantik untuk menyandang jawatan dalam jawatankuasa bagi tahun ' + tahun + ' seperti senarai di lampiran.'),
          para('3', 'Tuan/puan adalah dipohon melaksanakan tugas dan tanggungjawab yang diamanahkan dengan penuh dedikasi.'),
          para('', 'Kerjasama daripada tuan/puan amatlah dihargai dan didahului dengan ucapan terima kasih.'), para('', 'Sekian,')] }));
      dok.appendChild(h('div', { class: 'surat lampiran' }, h('p', { style: 'text-align:center;font-weight:700;margin:0' }, 'MRSM SULTAN AZLAN SHAH'),
        h('p', { class: 'surat-tajuk', style: 'text-align:center;margin-top:0' }, 'SENARAI JAWATANKUASA DAN JAWATAN TAHUN ' + tahun), h('p', { style: 'margin:.8em 0 0' }, 'Nama : ', h('b', null, s.nama)), jadualLantik));
    });
  }
  [pilih, tajuk, hj.input, tt.nama, tt.jawatan].forEach(function (e) { e.addEventListener('input', function () { tt.simpan(); lukis(); }); e.addEventListener('change', lukis); });
  lukis();
  return h('div', null,
    h('div', { class: 'tajuk-halaman tiada-cetak' }, h('div', null, h('h1', null, 'Surat Perlantikan ' + tahun), h('p', null, 'Satu surat bagi setiap staf; senarai jawatankuasa dan jawatan beliau dipaparkan pada lampiran. Tarikh surat ditetapkan ' + tarikhMasehi(tkh) + '; ruang Rujuk Kami dibiarkan kosong untuk ditulis secara manual.'))),
    h('div', { class: 'kad tiada-cetak', style: 'margin-bottom:1rem' }, h('div', { class: 'grid-borang' }, medan('Penerima', pilih), medan('Tajuk surat', tajuk), hj.medan, tt.medan), h('div', { class: 'baris-alat', style: 'margin-top:.6rem' }, butangCetak())),
    dok);
}

/* ===== Surat Panggilan Mesyuarat ===== */
async function paparSuratMesyuarat() {
  var d = await panggil('laporanInduk', { tahun: S.tahun }), tahun = d.tahun, hariIni = new Date(), pad = function (n) { return String(n).padStart(2, '0'); };
  var jkSel = pilihSelect(d.jk.map(function (j, i) { return { nilai: i, label: (j.kod ? j.kod + ' — ' : '') + j.nama }; }), '', '— Pilih jawatankuasa —');
  var f = { tarikhSurat: h('input', { type: 'date', value: hariIni.getFullYear() + '-' + pad(hariIni.getMonth() + 1) + '-' + pad(hariIni.getDate()) }),
    rujuk: h('input', { placeholder: 'cth. MRSMSAS.100-14/1/5 ( )' }), tajuk: h('input', { placeholder: 'cth. MESYUARAT … BIL.1/' + tahun }), tarikhM: h('input', { type: 'date' }),
    masa: h('input', { type: 'time', value: '14:30' }), agenda: h('textarea', { rows: 4, placeholder: 'Ucapan Pengerusi\nPengesahan Minit Mesyuarat\nPerkara Berbangkit\nHal-hal lain' }), tempat: h('input', { placeholder: 'cth. Bilik Mesyuarat (Rafflesia)' }) };
  var tt = borangPenandatangan(), hj = kawalanHijrah(), dok = dokSurat(), tajukDisunting = false;
  f.tajuk.addEventListener('input', function () { tajukDisunting = true; });

  function lukis() {
    kosongkan(dok);
    var tS = tarikhDari(f.tarikhSurat.value), tM = tarikhDari(f.tarikhM.value), jk = jkSel.value === '' ? null : d.jk[Number(jkSel.value)];
    if (!jk) { dok.appendChild(h('div', { class: 'kad kosong tiada-cetak' }, 'Pilih jawatankuasa untuk memaparkan surat dan senarai ahli.')); return; }
    if (!tS) { dok.appendChild(h('div', { class: 'kad kosong tiada-cetak' }, 'Isi tarikh surat.')); return; }
    var butir = h('table', { class: 'surat-butir' },
      h('tr', null, h('td', null, 'Tarikh'), h('td', null, ':'), h('td', null, tM ? tarikhMasehi(tM) + ' (' + HARI_MS[tM.getUTCDay()] + ')' : '')),
      h('tr', null, h('td', null, 'Masa'), h('td', null, ':'), h('td', null, masaBM(f.masa.value))),
      h('tr', null, h('td', null, 'Tempat'), h('td', null, ':'), h('td', null, f.tempat.value)));
    dok.appendChild(memo({ kepada: 'Seperti di lampiran', rujukKami: f.rujuk.value, tarikh: tarikhMasehi(tS), hijrah: hj.nilai(tS), tajuk: f.tajuk.value.toUpperCase(), penandatangan: tt.baca(),
      badan: [para('', 'Dengan segala hormatnya mohon di rujuk perkara di atas.'),
        para('2', 'Sukacita dimaklumkan tuan/puan diminta untuk menghadiri mesyuarat tersebut seperti butiran berikut :'), butir].concat(agendaNod(f.agenda.value)).concat([
        para('', 'Kerjasama daripada tuan/puan amatlah dihargai dan didahului dengan ucapan terima kasih.'), para('', 'Sekian,')]) }));
    // Lampiran: senarai ahli jawatankuasa terpilih; label jawatan dipaparkan sekali bagi jawatan berturutan yang sama.
    var terdahulu = null;
    dok.appendChild(h('div', { class: 'surat lampiran' }, h('p', { style: 'text-align:center;font-weight:700;margin:0' }, 'MRSM SULTAN AZLAN SHAH'), h('p', { class: 'surat-tajuk', style: 'text-align:center;margin-top:0' }, jk.nama.toUpperCase()),
      jk.ahli.length ? h('table', { class: 'surat-ahli' }, jk.ahli.map(function (a) {
        var label = a.jawatan === terdahulu ? '' : labelJawatan(a.jawatan); terdahulu = a.jawatan;
        return h('tr', null, h('td', { class: 'aj' }, label), h('td', { style: 'width:14px' }, ':'), h('td', null, namaPaparan(a)));
      })) : h('p', { class: 'diam' }, 'Belum ada ahli dilantik dalam jawatankuasa ini.')));
  }
  jkSel.addEventListener('change', function () {
    if (!tajukDisunting && jkSel.value !== '') f.tajuk.value = 'MESYUARAT ' + d.jk[Number(jkSel.value)].nama.toUpperCase();
    lukis();
  });
  [f.tarikhSurat, f.rujuk, f.tajuk, f.tarikhM, f.masa, f.tempat, f.agenda, hj.input, tt.nama, tt.jawatan].forEach(function (e) { e.addEventListener('input', function () { tt.simpan(); lukis(); }); e.addEventListener('change', lukis); });
  lukis();
  return h('div', null,
    h('div', { class: 'tajuk-halaman tiada-cetak' }, h('div', null, h('h1', null, 'Surat Panggilan Mesyuarat'), h('p', null, 'Isi butiran di bawah. Senarai ahli pada lampiran diambil daripada jawatankuasa yang dipilih (tahun ' + tahun + ').'))),
    h('div', { class: 'kad tiada-cetak', style: 'margin-bottom:1rem' }, h('div', { class: 'grid-borang' },
      medan('Jawatankuasa', jkSel), medan('Tarikh surat', f.tarikhSurat), medan('Rujuk kami', f.rujuk), hj.medan, medan('Tajuk mesyuarat', f.tajuk),
      medan('Tarikh mesyuarat', f.tarikhM), medan('Masa', f.masa), medan('Tempat', f.tempat), medan('Agenda (pilihan, satu item setiap baris)', f.agenda), tt.medan),
      h('div', { class: 'baris-alat', style: 'margin-top:.6rem' }, butangCetak())),
    dok);
}
</script>
