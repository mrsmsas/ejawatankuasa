<script>

var TKW = { petaJK: {}, paparan: 'grid', sub: 'takwim', tahun: null, ikutTahun: null, tapis: { q: '', c: '' } };

  { id: '9DC3E6', name: 'CUTI TAMBAHAN', color: '#9DC3E6', legend: true }, { id: 'FF0000', name: 'PEPERIKSAAN', color: '#FF0000', legend: true },
  { id: 'C5E0B4', name: 'AKTIVITI PELAJAR', color: '#C5E0B4', legend: true }, { id: '7030A0', name: 'MINGGU AKTIVITI', color: '#7030A0', legend: true }

/* ---------- Utiliti tarikh ---------- */
function tkPad(n) { return (n < 10 ? '0' : '') + n; }
function tkIso(y, m, d) { return y + '-' + tkPad(m + 1) + '-' + tkPad(d); }
function tkDow(y, m, d) { return (new Date(y, m, d).getDay() + 6) % 7; } // Isnin = 0
function tkBilHari(y, m) { return new Date(y, m + 1, 0).getDate(); }
function tkEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function tkTarikh(k) { var p = k.split('-'); return +p[2] + ' ' + TKW_BULAN[+p[1] - 1].slice(0, 3) + ' ' + p[0]; }
function tkHariDari(k) { var p = k.split('-'); return TKW_HARI[tkDow(+p[0], +p[1] - 1, +p[2])]; }
function tkEsok(k) { var d = new Date(k + 'T00:00:00'); d.setDate(d.getDate() + 1); return tkIso(d.getFullYear(), d.getMonth(), d.getDate()); }

/* ---------- Pembaca Excel takwim ---------- */
function tkBulanDari(s) {
  s = String(s || '').trim();
  var p = [[/^jan/i, 0], [/^feb/i, 1], [/^mac|^mar/i, 2], [/^apr/i, 3], [/^mei|^may/i, 4], [/^jun/i, 5], [/^jul/i, 6], [/^ogo|^aug/i, 7], [/^sep/i, 8], [/^okt|^oct/i, 9], [/^nov/i, 10], [/^dis|^dec/i, 11]];
  for (var i = 0; i < p.length; i++) if (p[i][0].test(s)) return p[i][1];
  return -1;
}
function tkHariDariTeks(s) {
  s = String(s || '').trim();
  var p = [/^isn/i, /^sel/i, /^rab/i, /^kha/i, /^jum/i, /^sab/i, /^aha/i];

}
function tkTeksSel(c) { if (!c) return ''; var v = c.w != null ? c.w : c.v; return v == null ? '' : String(v); }
function tkWarnaSel(c) {
  if (!c || !c.s || (c.s.patternType && c.s.patternType !== 'solid')) return null;
  var fg = c.s.fgColor; if (!fg || !fg.rgb) return null;
  var rgb = String(fg.rgb).toUpperCase().slice(-6);
  return (rgb === 'FFFFFF' || rgb === '000000') ? null : rgb;
}
function tkBersih(t) { return String(t).replace(/\r/g, '').split('\n').map(function (l) { return l.replace(/\s+/g, ' ').trim(); }).filter(Boolean).join('\n'); }
function tkUraiSel(raw) {
  var s = String(raw).replace(/ /g, ' '), mk = '', m = s.match(/^\s*\[\s*([^\]\s]{1,3})\s*\]\s*/);
  if (m) { mk = m[1].replace(/[ɑa]/gi, 'α').replace(/[ßb]/gi, 'β'); s = s.slice(m[0].length); }

}
/* SheetJS tidak membaca isian gradient (sel dua warna menyerong = dua program bertindih) dan indeks isian rata selepas gradient menjadi tersasar,

   Pulangan: { 'G14': { a: 'WARNA1' } } (rata) atau { a, b, d: darjah } (dua warna) untuk helaian itu; null jika fail tiada gradient (guna SheetJS biasa). */
function tkTeksFail(wb, laluan) {
  var f = wb && wb.files && wb.files[laluan]; if (!f || f.content == null) return '';
  try { return typeof f.content === 'string' ? f.content : new TextDecoder('utf-8').decode(f.content); } catch (e) { return ''; }
}
function tkAttr(tag, nama) { var m = tag.match(new RegExp('\\b' + nama + '="([^"]*)"')); return m ? m[1].replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&') : null; }
function tkPetaIsian(wb, namaHelaian) {
  var gaya = tkTeksFail(wb, 'xl/styles.xml'); if (gaya.indexOf('<gradientFill') < 0) return null;
  var isian = [], blokIsian = gaya.match(/<fills\b[^>]*>([\s\S]*?)<\/fills>/); if (!blokIsian) return null;
  blokIsian[1].replace(/<fill>([\s\S]*?)<\/fill>/g, function (_, dalam) {
    var g = dalam.match(/<gradientFill\b([^>]*)>([\s\S]*?)<\/gradientFill>/), hasil = null, rata = dalam.match(/<patternFill\b[^>]*\bpatternType="solid"[^>]*>[\s\S]*?<fgColor\b[^>]*\brgb="([0-9A-Fa-f]{6,8})"/);
    if (rata) { var wr = rata[1].slice(-6).toUpperCase(); if (wr !== 'FFFFFF' && wr !== '000000') hasil = { a: wr }; }

      var warna = []; g[2].replace(/<color\b[^>]*\brgb="([0-9A-Fa-f]{6,8})"/g, function (_2, rgb) { rgb = rgb.slice(-6).toUpperCase(); if (warna[warna.length - 1] !== rgb) warna.push(rgb); return ''; });
      var a = warna[0], b = null; for (var i = 1; i < warna.length; i++) if (warna[i] !== a) b = warna[i];

  if (!xf.some(Boolean)) return null;

  var idRel = null; tkTeksFail(wb, 'xl/workbook.xml').replace(/<sheet\b[^>]*>/g, function (t) { if (tkAttr(t, 'name') === namaHelaian) idRel = tkAttr(t, 'r:id'); return ''; });

  xml.replace(/<c\b[^>]*>/g, function (t) { var r = tkAttr(t, 'r'), si = tkAttr(t, 's'); if (r && si != null && xf[Number(si)]) { peta[r] = xf[Number(si)]; ada = true; } return ''; });

function tkBacaHelaian(X, wb, namaHelaian) {

  tajuk = tkBersih(tajuk).replace(/\n/g, ' ');

  var bulan = lajurBulan.map(function (col) {

    if (yy) y = +yy[0]; else if (sebelum >= 0 && m < sebelum) y++;
    sebelum = m; return { y: y, m: m, label: TKW_BULAN[m], col: col };
  });
  // Tarikh dikira ikut kedudukan baris (baris pertama grid = Isnin minggu pertama) kerana sesetengah sel tarikh dibiarkan kosong.
  var peta = null; try { peta = tkPetaIsian(wb, namaHelaian); } catch (e) { amaran.push('Warna sel tidak dapat dibaca terus daripada fail: ' + e.message); }
  var isianSel = function (r, c, cl) { if (peta) return peta[X.utils.encode_cell({ r: r, c: c })] || null; var w = tkWarnaSel(cl); return w ? { a: w } : null; };

    var hw = tkHariDariTeks(tkTeksSel(sel(r, jl.s.c)));
    if (hw < 0) { if (mula) break; else continue; }
    if (!mula && hw !== 0) amaran.push('Baris pertama grid bukan Isnin; semak susunan hari.');
    mula = true; akhirGrid = r; gi++;
    bulan.forEach(function (mo) {
      var d = gi - tkDow(mo.y, mo.m, 1) + 1;
      if (d < 1 || d > tkBilHari(mo.y, mo.m)) return;
      var cl = sel(r, mo.col), raw = tkTeksSel(cl), p = raw.trim() ? tkUraiSel(raw) : null;
      if (p && p.d !== d) tidakPadan++;

      // Lajur kecil "1" = hari persekolahan. Format satu lajur sebulan (fail dimuat turun dari sistem): lajur sebelah ialah bulan lain, jangan baca.
      if (lajurBulan.indexOf(mo.col + 1) < 0 && tkTeksSel(sel(r, mo.col + 1)).trim() === '1') rek.s = 1;

function tkSenaraiAcara(d) {

    var r = d.days[k]; if (!r.t) return;

/* ---------- Pembaca lampiran Excel (helaian selain grid takwim) ----------
   Setiap helaian dibaca menjadi modul seragam: { tajuk, ket, bahagian: [ { tajuk, lajur, baris, tebal, nota } ] }.
   Helaian dikenali melalui namanya; helaian yang tiada dilangkau. */
var TKW_LAMP = [
  { k: 'zon', ikon: '🧭', label: '4 Zon', nama: /^\s*4\s*zon/i, baca: tkBacaZon },
  { k: 'tuanrumah', ikon: '🏠', label: 'Cadangan Tuan Rumah', nama: /tuan\s*rumah/i, baca: tkBacaTuanRumah },
  { k: 'negeri', ikon: '📍', label: 'MRSM Ikut Negeri', nama: /ikut\s*negeri|mengikut\s*negeri/i, baca: tkBacaNegeri },
  { k: 'akademik', ikon: '🎓', label: 'Kalendar Akademik', nama: /kalendar\s*akademik/i, baca: tkBacaAkademik },
  { k: 'hari', ikon: '🏫', label: 'Hari Persekolahan', nama: /hari\s*persekolahan/i, baca: tkBacaHariSekolah, lebar: true }

function tkLamp(k) { for (var i = 0; i < TKW_LAMP.length; i++) if (TKW_LAMP[i].k === k) return TKW_LAMP[i]; return null; }
// Teks sel untuk lampiran: tarikh (format tarikh Excel) -> "4 Jan 2027"; selain itu teks terformat, baris baharu dikekalkan.
function tkTeksLamp(X, c) {
  if (!c) return '';
  if (c.t === 'n' && c.z && !/^general$/i.test(c.z) && /d/i.test(String(c.z).replace(/\\./g, '').replace(/"[^"]*"/g, '')) && /y/i.test(String(c.z).replace(/\\./g, '').replace(/"[^"]*"/g, ''))) {
    var d = X.SSF.parse_date_code(c.v); if (d && d.y) return d.d + ' ' + TKW_BULAN[d.m - 1].slice(0, 3) + ' ' + d.y;

function tkLampKonteks(X, ws) {

}
function tkCariTeks(K, padan, r1, r2, c1, c2) {

}

function tkBacaTuanRumah(X, ws) {

function tkBacaNegeri(X, ws) {

function tkBacaZon(X, ws) {
